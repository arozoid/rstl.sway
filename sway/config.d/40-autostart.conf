### autostart
# `exec` runs once per session, `exec_always` on every start and every reload
# (win+shift+c), which is what you want for anything that has to survive a
# config reload.
#
# The base edition has no swayidle, swaylock, cliphist or cronie, so
# bin/install-base.sh comments out / removes the matching lines in this file
# when it installs. Keep the binaries optional or the base desktop breaks.

# first-login hook: one-shot per-user setup (idempotent, guarded by its marker)
exec_always --no-startup-id rstl-first-login
exec_always --no-startup-id ~/.config/rstl.sway/scripts/wallpaper-restore.sh
# auto-scale sets output scale + bar/cursor sizing before the bar starts
exec_always --no-startup-id sh -c 'killall -q yambar yambar-fullscreen.sh; ~/.config/rstl.sway/scripts/auto-scale.sh; sleep 0.2; ~/.config/rstl.sway/scripts/yambar-fullscreen.sh'

exec --no-startup-id swayidle -w -C ~/.config/swayidle/config
exec --no-startup-id clipse -listen
#exec --no-startup-id ~/.local/bin/nightlight.sh
exec --no-startup-id ~/.config/rstl.sway/scripts/chime.sh
#exec --no-startup-id ~/.config/rstl.sway/scripts/usb-sound.sh

exec_always --no-startup-id sh -c 'killall -q mako; sleep 0.2; mako'

# polkit authentication agent
exec_always --no-startup-id /usr/bin/rstlpk

# session environment, so Qt/GTK apps inside the session pick it up
exec_always sh -c 'export XDG_CURRENT_DESKTOP=sway XDG_SESSION_DESKTOP=sway; dbus-update-activation-environment --systemd XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP WAYLAND_DISPLAY DISPLAY GTK_THEME QT_QPA_PLATFORMTHEME'
