### appearance
# Borders, gaps and the client colors. 1px borders, no margin, forest green.

default_border pixel 1
default_floating_border pixel 0

gaps inner 0
gaps outer 0

# subtle neutral window borders
client.focused          #777d78 #777d78 #d8dcd8 #777d78 #777d78
client.unfocused        #353a36 #353a36 #929892 #353a36 #353a36
client.focused_inactive #505751 #505751 #b8beb9 #505751 #505751
client.urgent           #a5aca6 #a5aca6 #f0f2f0 #a5aca6 #a5aca6

# reduce border clutter
hide_edge_borders smart
smart_borders on

