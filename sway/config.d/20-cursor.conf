### cursor
# The size here is only the fallback: scripts/auto-scale.sh reads the panel's
# EDID physical size and sets the real size through
# `swaymsg seat seat0 xcursor_theme <name> <size>` before the bar starts. The
# theme name is the part to edit - auto-scale.sh reads it from this very file
# (and falls back to Notwaita-Gray if the line is gone), so this is the only
# place it is written down.
#
# Other themes installed by the dotfiles: Bibata-Modern-Ice, Bibata-Modern-Classic

seat seat0 xcursor_theme Notwaita-Gray 25
