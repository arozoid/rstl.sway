### displays
# Per-output settings go here. There are none by default, because the scale is
# computed at startup instead of hardcoded:
#
#   scripts/auto-scale.sh   reads every output's EDID physical size and mode,
#                           picks a scale from the pixel density (PPI) and
#                           applies it with `swaymsg output <name> scale <n>`.
#                           Large 16:9/16:10 1440p+ panels get a 1.5x floor;
#                           ultrawides stay on the density ladder.
#                           It also sets the bar and cursor size from the same
#                           physical mm.
#   scripts/toggle-monitors.sh  snapshots and restores mode/scale/workspace
#                           (win+shift+o), so it picks up whatever is set here.
#
# Static settings sway can own are plain `output` lines, for example:
#
#   output DP-1 mode 2560x1440@59.951Hz position 1920x0
#   output HDMI-A-1 scale 1.5
#   output eDP-1 disable
#
# An explicit `output <name> scale <n>` line is honored by auto-scale.sh
# instead of the density rule. Use it when a panel's EDID is wrong or when
# you want a fixed scale for one screen; the value still has to be between
# 1.0 and 2.0.
