### displays
# Per-output settings go here. There are none by default, because the scale is
# computed at startup instead of hardcoded:
#
#   scripts/auto-scale.sh   reads every output's EDID physical size, picks a
#                           scale band (<17" / <25" / >=25") and applies it with
#                           `swaymsg output <name> scale <n>`. It also sets the
#                           bar and cursor size from the same physical mm.
#   scripts/toggle-monitors.sh  snapshots and restores mode/scale/workspace
#                           (win+shift+o), so it picks up whatever is set here.
#
# Static settings sway can own are plain `output` lines, for example:
#
#   output DP-1 mode 2560x1440@59.951Hz position 1920x0
#   output HDMI-A-1 scale 1.5
#   output eDP-1 disable
#
# Note that any `scale` line here is applied at config load and then replaced by
# auto-scale.sh a moment later; for the scale, edit the bands in that script.
