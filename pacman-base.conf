#
# /etc/pacman.conf
#
# Minimal Arch Linux pacman.conf used to bootstrap a raw base rootfs with
# pacstrap. It deliberately has NO CachyOS repositories, so pacman never
# trips over missing /etc/pacman.d/cachyos*-mirrorlist include files while
# the CachyOS keyring + mirrorlists are being installed. It is replaced by
# the architecture-specific pacman-vN.conf once those are present.
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = auto

#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Trim translations/man/info/doc to keep the rootfs small: keep only the
# en/US + C locales (used for new installs in the chroot).
NoExtract = usr/share/locale/*
NoExtract = !usr/share/locale/en_US/*
NoExtract = !usr/share/locale/locale.alias
NoExtract = !usr/share/locale/C*
NoExtract = usr/share/man/*
NoExtract = usr/share/info/*
NoExtract = usr/share/doc/*

# Misc options
#UseSyslog
#Color
#NoProgressBar
CheckSpace
#VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#
# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines.

#[testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
