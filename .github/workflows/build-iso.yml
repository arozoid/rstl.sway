# Build rstl.sway frugal ISOs: ONE matrix of 30 jobs (program config x
# microarchitecture), each producing THREE ISOs, then a GitHub release named
# YYYYMMDD-N (N = release number for the day: 1, 2, ...) holding all 90 ISOs.
#
# Triggers: weekly autogenerated (schedule, Sundays 02:30 UTC) plus manual
# workflow_dispatch. No push trigger: releases are generated on a cadence and
# pruned to keep only the 2 most recent (see the release job).
#
# Kernels: cachyos (linux-cachyos, the default), vdpup (the FirstRib huge
# kernel 6.1.52 - a retro LTS with no pacman package; FirstRib's stock
# vmlinuz + 00modules.sfs + initrd-latest.gz are dropped in unmodified, so
# nothing is rebuilt for it), and rstl (the rstl.sway own kernel from the
# latest github.com/arozoid/rstl.linuz release - vmlinuz + its module/firmware
# trees come from the release's -long tar.zst; loop is a module
# (CONFIG_BLK_DEV_LOOP=m), so the initrd is rebuilt via the normal mkFRkernel
# path with loop.ko carried inside).
#
# The vdpup (free rewrap) and rstl (full build) variants:
#   - The vdpup ISO reuses the compressed rootfs (07rootfs.sfs) left in place
#     by the cachyos wrap step (mkfrugal-iso.sh squashes 07rootfs/ in place
#     under --source-root) and just swaps the three boot files for the vdpup
#     stock assets. That keeps compute at ~1 rootfs build per job for the
#     vdpup variant; the only vdpup-specific work is the cached download.
#   - The rstl ISO is a genuine second full build: the mkFRkernel initrd is
#     rebuilt from the rstl module tree, so it needs a fresh rootfs. This is
#     ~2 rootfs builds per job (cachyos + rstl).
#
# Program configurations (--program): vim (nvim + superfile), mouse (micro +
# cachyos-micro-settings + rovr), each optionally bundled with firefox
# (--firefox). install-base carries no program config: only standard and
# standard + firefox entries exist for it.
#
# --arch vN selects pacman-vN.conf so the rootfs is installed against the
# matching CachyOS repo tier (v1/v2 -> generic [cachyos], v3 -> the
# x86_64_v3 optimized repo).
#
# v4 is intentionally NOT in the matrix: x86_64_v4 (AVX-512) binaries signal 4
# (SIGILL) as soon as a chrooted command runs on a host without AVX-512, and
# neither GitHub runners nor desktop CPU < Ice Lake/Zen4 have it. v4 ISOs can
# still be built locally with:  sudo ./mkfrugal-rstl.sh stage --arch v4 ...
name: Build Frugal ISOs

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

concurrency:
  group: frugal-iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the YYYYMMDD-N release, prune old ones
  actions: read   # download the ISO artifacts for the release

jobs:
  build-frugal-iso:
    name: ${{ matrix.flavor }}-${{ matrix.program }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: install, program: vim, arch: v1 }
          - { flavor: install, program: vim, arch: v2 }
          - { flavor: install, program: vim, arch: v3 }
          - { flavor: install, program: mouse, arch: v1 }
          - { flavor: install, program: mouse, arch: v2 }
          - { flavor: install, program: mouse, arch: v3 }
          - { flavor: install, program: vim-firefox, arch: v1 }
          - { flavor: install, program: vim-firefox, arch: v2 }
          - { flavor: install, program: vim-firefox, arch: v3 }
          - { flavor: install, program: mouse-firefox, arch: v1 }
          - { flavor: install, program: mouse-firefox, arch: v2 }
          - { flavor: install, program: mouse-firefox, arch: v3 }
          - { flavor: install-min, program: vim, arch: v1 }
          - { flavor: install-min, program: vim, arch: v2 }
          - { flavor: install-min, program: vim, arch: v3 }
          - { flavor: install-min, program: mouse, arch: v1 }
          - { flavor: install-min, program: mouse, arch: v2 }
          - { flavor: install-min, program: mouse, arch: v3 }
          - { flavor: install-min, program: vim-firefox, arch: v1 }
          - { flavor: install-min, program: vim-firefox, arch: v2 }
          - { flavor: install-min, program: vim-firefox, arch: v3 }
          - { flavor: install-min, program: mouse-firefox, arch: v1 }
          - { flavor: install-min, program: mouse-firefox, arch: v2 }
          - { flavor: install-min, program: mouse-firefox, arch: v3 }
          - { flavor: install-base, program: standard, arch: v1 }
          - { flavor: install-base, program: standard, arch: v2 }
          - { flavor: install-base, program: standard, arch: v3 }
          - { flavor: install-base, program: firefox, arch: v1 }
          - { flavor: install-base, program: firefox, arch: v2 }
          - { flavor: install-base, program: firefox, arch: v3 }
    steps:
      - name: Update system and install tooling
        run: |
          pacman -Syu --noconfirm \
            base-devel sudo git rust wget xorriso mtools dosfstools \
            squashfs-tools arch-install-scripts grub kmod cpio gzip xz zstd

      - name: Pin HOME=/root for chroot sanity
        run: echo "HOME=/root" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust git checkout (dubious ownership)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache huge-kernel firmware
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cache/01firmware.sfs
          key: cachyos-firmware

      - name: Fetch huge-kernel firmware
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/cache"
          [ -s "$GITHUB_WORKSPACE/cache/01firmware.sfs" ] && exit 0
          URL="https://gitlab.com/firstrib/firstrib/-/raw/master/latest/build_system/huge_kernels/kernel_usrmerge_default/01firmware.sfs"
          curl -fL --connect-timeout 30 --max-time 1800 --retry 3 --retry-delay 5 "$URL" -o "$GITHUB_WORKSPACE/cache/01firmware.sfs"

      - name: Cache vdpup huge kernel (vmlinuz + modules sfs + initrd)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/cache/vdpup-vmlinuz
            ${{ github.workspace }}/cache/vdpup-00modules.sfs
            ${{ github.workspace }}/cache/vdpup-initrd.gz
          key: vdpup-kernel-6.1.52

      - name: Cache rstl kernel (latest rstl.linuz release assets)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/cache/rstl-kernel.tar.zst
            ${{ github.workspace }}/cache/rstl-vmlinuz
            ${{ github.workspace }}/cache/rstl-00modules.sfs
            ${{ github.workspace }}/cache/rstl-modules
            ${{ github.workspace }}/cache/rstl-firmware.sfs
          key: rstl-kernel

      - name: Build frugal (${{ matrix.arch }}, ${{ matrix.flavor }}-${{ matrix.program }}) + wrap all 3 kernel ISOs
        timeout-minutes: 120
        run: |
          set -uo pipefail
          chmod +x mkfrugal-rstl.sh mkfrugal-iso.sh mkFRkernel
          FLAVOR="${{ matrix.flavor }}"
          PROG="${{ matrix.program }}"
          ARCH="${{ matrix.arch }}"
          DATE="$(date +%Y%m%d)"
          case "$PROG" in
            vim|vim-firefox)   PROGMODE=vim ;;
            mouse|mouse-firefox) PROGMODE=mouse ;;
            *) PROGMODE=standard ;;              # standard, firefox
          esac
          FIRE=0
          case "$PROG" in *-firefox|firefox) FIRE=1 ;; esac
          FIREBRA=""
          [ "$FIRE" -eq 1 ] && FIREBRA="--firefox"
          STAGE="$GITHUB_WORKSPACE/stage"
          VSTAGE="$GITHUB_WORKSPACE/vstage"
          RSTAGE="$GITHUB_WORKSPACE/rstage"
          mkdir -p "$STAGE" dist
          # program flags are meaningless for install-base; pass them only for
          # the install/install-min flavors (mkfrugal rejects --program standard)
          ARGS_PROG=""
          if [ "$PROGMODE" != "standard" ]; then ARGS_PROG="--program $PROGMODE"; fi
          # build in the background with a 90s progress heartbeat; every 90s we
          # print the last build.log line so a long build is visibly alive
          # RSTL_TRACE=1 makes the installer scripts set -x (via chr env)
          export RSTL_TRACE=1
          ( timeout 55m ./mkfrugal-rstl.sh \
              "$STAGE/rstlsway" \
              --arch "$ARCH" \
              --flavor "$FLAVOR" \
              $ARGS_PROG $FIREBRA \
              --yes \
              --kernel linux-cachyos \
              --firmware "$GITHUB_WORKSPACE/cache/01firmware.sfs" \
              --cache "$GITHUB_WORKSPACE/cache" \
          ) > build.log 2>&1 &
          BUILDPID=$!
          while kill -0 "$BUILDPID" 2>/dev/null; do
            sleep 90
            echo "still building ($(date -u +%H:%M:%S)Z) - $(tail -1 build.log 2>/dev/null | cut -c1-180)"
          done
          STATUS=0
          wait "$BUILDPID" || STATUS=$?
          if [ "$STATUS" -eq 124 ]; then
            echo "::error::mkfrugal-rstl.sh timed out after 55m ($FLAVOR $PROG $ARCH)"
          elif [ "$STATUS" -ne 0 ]; then
            echo "::error::mkfrugal-rstl.sh failed ($FLAVOR $PROG $ARCH) exit $STATUS"
          else
            echo "mkfrugal-rstl.sh OK ($FLAVOR $PROG $ARCH)"
          fi
          if [ "$STATUS" -ne 0 ]; then
            tail -80 build.log >&2
            echo "::warning::full build.log stored in the buildlog artifact"
            exit 1
          fi
          # 1/3 cachyos ISO. --source-root squashes 07rootfs/ -> 07rootfs.sfs in
          # place, so the compressed rootfs stays in the stage tree and is
          # reused verbatim for the vdpup variant (no second rootfs build).
          ./mkfrugal-iso.sh \
            -d "$STAGE/rstlsway" \
            -S "$STAGE" \
            -n rstlsway \
            -l RSTLSW \
            -o "dist/rstlsway-cachyos-$FLAVOR-$PROG-$ARCH-$DATE-x86_64.iso" || {
              echo "::error::mkfrugal-iso.sh failed (cachyos $FLAVOR $PROG $ARCH)"
              exit 1
            }
          # 2/3 vdpup variant: fetch the stock huge-kernel assets (cached), copy
          # the cachyos frugal (07rootfs.sfs already zstd 19 -> reused as-is),
          # swap the three boot files, fix the docs, rewrap into a second ISO.
          ./mkfrugal-rstl.sh --fetch-vdpup --cache "$GITHUB_WORKSPACE/cache"
          mkdir -p "$VSTAGE"
          cp -al "$STAGE/rstlsway" "$VSTAGE/rstlsway-vdpup"
          for f in vmlinuz 00modules.sfs initrd.gz; do
            rm -f "$VSTAGE/rstlsway-vdpup/$f"
            cp -a "$GITHUB_WORKSPACE/cache/vdpup-$f" "$VSTAGE/rstlsway-vdpup/$f"
          done
          sed -i 's/rstlsway/rstlsway-vdpup/g' "$VSTAGE/rstlsway-vdpup/grub_config.txt"
          printf '%s\n' \
            "name:   rstlsway-vdpup" \
            "flavor: $FLAVOR" \
            "program: $PROGMODE${FIREBRA:+ + firefox}" \
            "arch:   x86-64-v${ARCH#v}" \
            "kernel: vdpup (FirstRib huge kernel 6.1.52)" \
            "build:  $(date -u '+%Y-%m-%d %H:%M UTC')" \
            > "$VSTAGE/rstlsway-vdpup/readme_kernel_version.txt"
          ./mkfrugal-iso.sh \
            -d "$VSTAGE/rstlsway-vdpup" \
            -S "$VSTAGE" \
            -n rstlsway-vdpup \
            -l RSTLSW \
            -o "dist/rstlsway-vdpup-$FLAVOR-$PROG-$ARCH-$DATE-x86_64.iso" || {
              echo "::error::mkfrugal-iso.sh failed (vdpup $FLAVOR $PROG $ARCH)"
              exit 1
            }
          # 3/3 rstl variant: a genuine second full build (the mkFRkernel
          # initrd is rebuilt from the rstl module tree, so it cannot reuse
          # the cachyos rootfs). The rstl.linuz assets are cached; the initrd
          # carries loop.ko (CONFIG_BLK_DEV_LOOP=m in the rstl kernel).
          ./mkfrugal-rstl.sh --fetch-rstl --cache "$GITHUB_WORKSPACE/cache"
          ( timeout 55m ./mkfrugal-rstl.sh \
              "$RSTAGE/rstlsway-rstl" \
              --arch "$ARCH" \
              --flavor "$FLAVOR" \
              $ARGS_PROG $FIREBRA \
              --yes \
              --kernel rstl \
              --cache "$GITHUB_WORKSPACE/cache" \
          ) > build-rstl.log 2>&1 &
          BUILDPID=$!
          while kill -0 "$BUILDPID" 2>/dev/null; do
            sleep 90
            echo "still building rstl ($(date -u +%H:%M:%S)Z) - $(tail -1 build-rstl.log 2>/dev/null | cut -c1-180)"
          done
          STATUS=0
          wait "$BUILDPID" || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            tail -80 build-rstl.log >&2
            echo "::error::mkfrugal-rstl.sh failed (rstl $FLAVOR $PROG $ARCH) exit $STATUS"
            exit 1
          fi
          echo "mkfrugal-rstl.sh OK (rstl $FLAVOR $PROG $ARCH)"
          ./mkfrugal-iso.sh \
            -d "$RSTAGE/rstlsway-rstl" \
            -S "$RSTAGE" \
            -n rstlsway-rstl \
            -l RSTLSW \
            -o "dist/rstlsway-rstl-$FLAVOR-$PROG-$ARCH-$DATE-x86_64.iso" || {
              echo "::error::mkfrugal-iso.sh failed (rstl $FLAVOR $PROG $ARCH)"
              exit 1
            }
          rm -rf "$STAGE" "$VSTAGE" "$RSTAGE"
          ls -lh dist

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: buildlog-${{ matrix.flavor }}-${{ matrix.program }}-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload ISO artifact (all 3 kernels)
        uses: actions/upload-artifact@v5
        with:
          name: iso-${{ matrix.flavor }}-${{ matrix.program }}-${{ matrix.arch }}
          path: dist/*.iso
          if-no-files-found: error

  release:
    needs: build-frugal-iso
    runs-on: ubuntu-latest
    steps:
      - name: Download all ISOs
        uses: actions/download-artifact@v5
        with:
          pattern: iso-*
          path: dist
          merge-multiple: true

      - name: Create YYYYMMDD-N release and prune to the 2 newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          date_tag="$(date +%Y%m%d)"
          rel=""
          for i in $(seq 1 99); do
            tag="${date_tag}-${i}"
            if ! gh release view "$tag" --json id --jq .id >/dev/null 2>&1; then
              rel="$tag"
              break
            fi
          done
          [ -n "$rel" ] || { echo "::error::too many releases for $date_tag"; exit 1; }
          echo "creating git tag + release '$rel'"
          cat > release-notes.md <<'EOF'
          `$ rstl.sway`

          Kernels:
          - rstl linux 7.x (rstl.sway's own kernel, mainline)
          - cachyOS linux 7.x (CachyOS optimized)
          - vdpup linux 6.1.52 (FirstRib huge kernel)

          Microarchitecture levels: v1 · v2 · v3

          Desktop configs:
          - install · install-min · install-base

          Program configs:
          - install: vim (nvim + superfile) · mouse (micro + cachyos-micro-settings + rovr) · vim + firefox · mouse + firefox
          - install-min: same program configs, keeping only each program's file manager
          - install-base: standard · standard + firefox (no program variants)

          Builds are autogenerated weekly and pruned to keep only the 2 most recent releases.
          EOF
          gh release create "$rel" \
            --target "$GITHUB_SHA" \
            --title "rstl.sway $rel" \
            --notes-file release-notes.md \
            dist/*.iso
          # prune: keep only the 2 newest releases (older releases + their
          # git tags are deleted)
          gh release list --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[2:][] | .tagName' 2>/dev/null \
            | while read -r old_tag; do
                [ -n "$old_tag" ] || continue
                echo "pruning $old_tag"
                gh release delete "$old_tag" --yes --cleanup-tag >/dev/null 2>&1 \
                  || echo "could not delete $old_tag"
              done