# Build rstl.sway frugal ISOs for every flavor x microarchitecture x kernel
# combo (18 matrix jobs: 2 kernels x 9), then publish a GitHub release named
# YYYYMMDD-N (N = release number for the day: 1, 2, ...) holding the ISOs.
#
# Only runs on push (no scheduled/publishing cadence).
#
# Kernels: cachyos (linux-cachyos, the default) and vdpup, the FirstRib huge
# kernel 6.1.52-vdpup (a retro LTS with no pacman package - mkfrugal-rstl.sh
# drops in FirstRib's stock vmlinuz + 00modules.sfs + initrd-latest.gz
# unmodified, so nothing is rebuilt for it). --arch vN selects pacman-vN.conf
# so the rootfs is installed against the matching CachyOS repo tier
# (v1/v2 -> generic [cachyos], v3 -> the x86_64_v3 optimized repo). For the
# cachyos kernel mkfrugal-rstl.sh bakes the modules into the initrd (mkFRkernel)
# and ships the full module tree in 00modules.sfs.
#
# v4 is intentionally NOT in the matrix: x86_64_v4 (AVX-512) binaries signal 4
# (SIGILL) as soon as a chrooted command runs on a host without AVX-512, and
# neither GitHub runners nor desktop CPU < Ice Lake/Zen4 have it. v4 ISOs can
# still be built locally with:  sudo ./mkfrugal-rstl.sh stage --arch v4 ...
name: Build Frugal ISOs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: frugal-iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the YYYYMMDD-N release
  actions: read   # download the ISO artifacts for the release

jobs:
  build-frugal-iso:
    name: ${{ matrix.flavor }}-${{ matrix.arch }}-${{ matrix.kernel }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        flavor: [install, install-min, install-uber-min]
        arch: [v1, v2, v3]
        kernel: [cachyos, vdpup]
    steps:
      - name: Update system and install tooling
        run: |
          pacman -Syu --noconfirm \
            base-devel sudo git rust wget xorriso mtools dosfstools \
            squashfs-tools arch-install-scripts grub kmod cpio gzip xz zstd

      - name: Pin HOME=/root for chroot sanity
        run: echo "HOME=/root" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust git checkout (dubious ownership)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache huge-kernel firmware
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cache/01firmware.sfs
          key: cachyos-firmware

      - name: Fetch huge-kernel firmware
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/cache"
          [ -s "$GITHUB_WORKSPACE/cache/01firmware.sfs" ] && exit 0
          URL="https://gitlab.com/firstrib/firstrib/-/raw/master/latest/build_system/huge_kernels/kernel_usrmerge_default/01firmware.sfs"
          curl -fL --connect-timeout 30 --max-time 1800 --retry 3 --retry-delay 5 "$URL" -o "$GITHUB_WORKSPACE/cache/01firmware.sfs"

      - name: Cache vdpup huge kernel (vmlinuz + modules sfs + initrd)
        if: matrix.kernel == 'vdpup'
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/cache/vdpup-vmlinuz
            ${{ github.workspace }}/cache/vdpup-00modules.sfs
            ${{ github.workspace }}/cache/vdpup-initrd.gz
          key: vdpup-kernel-6.1.52

      - name: Build frugal (${{ matrix.arch }}, ${{ matrix.flavor }}, ${{ matrix.kernel }}) + wrap ISO
        timeout-minutes: 65
        run: |
          set -uo pipefail
          chmod +x mkfrugal-rstl.sh mkfrugal-iso.sh mkFRkernel
          FLAVOR="${{ matrix.flavor }}"
          ARCH="${{ matrix.arch }}"
          KERNEL="${{ matrix.kernel }}"
          KERNEL_ARG="$KERNEL"
          [ "$KERNEL_ARG" = "cachyos" ] && KERNEL_ARG="linux-cachyos"
          DATE="$(date +%Y%m%d)"
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE" dist
          # build in the background with a 90s progress heartbeat; every 90s we
          # print the last build.log line so a long build is visibly alive
          # RSTL_TRACE=1 makes install-min/install-uber-min set -x (via chr env)
          export RSTL_TRACE=1
          ( timeout 55m ./mkfrugal-rstl.sh \
              "$STAGE/rstlsway" \
              --arch "$ARCH" \
              --flavor "$FLAVOR" \
              --yes \
              --kernel "$KERNEL_ARG" \
              --firmware "$GITHUB_WORKSPACE/cache/01firmware.sfs" \
              --cache "$GITHUB_WORKSPACE/cache" \
          ) > build.log 2>&1 &
          BUILDPID=$!
          while kill -0 "$BUILDPID" 2>/dev/null; do
            sleep 90
            echo "still building ($(date -u +%H:%M:%S)Z) - $(tail -1 build.log 2>/dev/null | cut -c1-180)"
          done
          STATUS=0
          wait "$BUILDPID" || STATUS=$?
          if [ "$STATUS" -eq 124 ]; then
            echo "::error::mkfrugal-rstl.sh timed out after 55m ($FLAVOR $ARCH $KERNEL)"
          elif [ "$STATUS" -ne 0 ]; then
            echo "::error::mkfrugal-rstl.sh failed ($FLAVOR $ARCH $KERNEL) exit $STATUS"
          else
            echo "mkfrugal-rstl.sh OK ($FLAVOR $ARCH $KERNEL)"
          fi
          if [ "$STATUS" -ne 0 ]; then
            tail -80 build.log >&2
            echo "::warning::full build.log stored in the buildlog artifact"
            exit 1
          fi
          ./mkfrugal-iso.sh \
            -d "$STAGE/rstlsway" \
            -S "$STAGE" \
            -n rstlsway \
            -l RSTLSW \
            -o "dist/rstlsway-$KERNEL-$FLAVOR-$ARCH-$DATE-x86_64.iso" || {
              echo "::error::mkfrugal-iso.sh failed ($FLAVOR $ARCH $KERNEL)"
              exit 1
            }
          rm -rf "$STAGE"
          ls -lh dist

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: buildlog-${{ matrix.flavor }}-${{ matrix.arch }}-${{ matrix.kernel }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v5
        with:
          name: iso-${{ matrix.flavor }}-${{ matrix.arch }}-${{ matrix.kernel }}
          path: dist/*.iso
          if-no-files-found: error

  release:
    needs: build-frugal-iso
    runs-on: ubuntu-latest
    steps:
      - name: Download all ISOs
        uses: actions/download-artifact@v5
        with:
          pattern: iso-*
          path: dist
          merge-multiple: true

      - name: Create YYYYMMDD-N release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          date_tag="$(date +%Y%m%d)"
          rel=""
          for i in $(seq 1 99); do
            tag="${date_tag}-${i}"
            if ! gh release view "$tag" --json id --jq .id >/dev/null 2>&1; then
              rel="$tag"
              break
            fi
          done
          [ -n "$rel" ] || { echo "::error::too many releases for $date_tag"; exit 1; }
          echo "creating git tag + release '$rel'"
          gh release create "$rel" \
            --target "$GITHUB_SHA" \
            --title "rstl.sway $rel" \
            --notes "Frugal ISOs from ${{ github.sha }}; kernels: cachyos (linux-cachyos), vdpup (FirstRib huge 6.1.52); flavors: install, install-min, install-uber-min; microarchitecture levels: v1, v2, v3" \
            dist/*.iso