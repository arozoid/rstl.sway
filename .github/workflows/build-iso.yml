# Build rstl.sway frugal ISOs with a two-phase matrix:
#
#   build-base   3 jobs (one per microarchitecture v1/v2/v3). Each pacstraps
#                ONE install-base rootfs (linux-cachyos kernel + modules + /boot
#                kept, users + passwords set) with mkfrugal-rstl.sh --stage-base,
#                then uploads it as the baserootfs-<arch> artifact. Only these
#                3 jobs touch the network for pacstrap / -Syu / the kernel pkg.
#
#   build-iso    9 jobs (flavor x microarchitecture). Each downloads the base
#                artifact for its arch, then per program config reuses the base
#                rootfs with --reuse-rootfs (no pacstrap, no CachyOS bootstrap,
#                no -Syu, no kernel install) and wraps all THREE kernel ISOs:
#                  - cachyos  (default linux-cachyos; the full layer build)
#                  - vdpup    (FirstRib huge kernel 6.1.52 rewrap: 07rootfs.sfs
#                              reused from the cachyos wrap, 3 boot files swapped)
#                  - rstl     (rstl.sway's own kernel from the latest
#                              arozoid/rstl.linuz release: rewrap of the cachyos
#                              frugal + an initrd freshly built via mkFRkernel
#                              from the cached rstl module tree, so loop.ko -
#                              CONFIG_BLK_DEV_LOOP=m - rides inside)
#                install / install-min layer 4 configs (vim · mouse · vim+firefox
#                · mouse+firefox) x 3 kernels = 12 ISOs; install-base layers
#                standard · standard+firefox x 3 kernels = 6 ISOs. 90 ISOs total.
#
# Artifacts: the ISO artifact names follow iso-<flavor>-<arch>; the release job
# downloads everything matching iso-*.
#
# Triggers: weekly autogenerated (schedule, Sundays 02:30 UTC) plus manual
# workflow_dispatch. No push trigger: releases are generated on a cadence and
# pruned to keep only the 2 most recent (see the release job).
#
# --arch vN selects pacman-vN.conf so the rootfs is installed against the
# matching CachyOS repo tier (v1/v2 -> generic [cachyos], v3 -> the x86_64_v3
# optimized repo).
#
# v4 is intentionally NOT in the matrix: x86_64_v4 (AVX-512) binaries signal 4
# (SIGILL) as soon as a chrooted command runs on a host without AVX-512, and
# neither GitHub runners nor desktop CPU < Ice Lake/Zen4 have it. v4 ISOs can
# still be built locally with:  sudo ./mkfrugal-rstl.sh stage --arch v4 ...
name: Build Frugal ISOs

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

concurrency:
  group: frugal-iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the YYYYMMDD-N release, prune old ones
  actions: read   # download the ISO artifacts for the release

jobs:
  # ---------------------------------------------------------------------------
  # phase 1: one reusable base rootfs per microarchitecture
  # ---------------------------------------------------------------------------
  build-base:
    name: base-${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [v1, v2, v3]
    steps:
      - name: Update system and install tooling
        run: |
          pacman -Syu --noconfirm \
            base-devel sudo git rust wget xorriso mtools dosfstools \
            squashfs-tools arch-install-scripts grub kmod cpio gzip xz zstd

      - name: Pin HOME=/root for chroot sanity
        run: echo "HOME=/root" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust git checkout (dubious ownership)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build base rootfs (install-base, --stage-base, linux-cachyos kept)
        timeout-minutes: 120
        run: |
          set -uo pipefail
          chmod +x mkfrugal-rstl.sh
          ARCH="${{ matrix.arch }}"
          STAGE="$GITHUB_WORKSPACE/base/$ARCH/stage"
          mkdir -p "$STAGE" "$GITHUB_WORKSPACE/cache"
          # Foreground + pipefail + tee on purpose: earlier versions backgrounded
          # the build (setsid) and watched it from a heartbeat loop, and the step
          # shell got hard-killed (exit 1, no output, no trap, no errexit trip)
          # at the exact moment the background builder exited - even when the
          # build had finished successfully (build.log always ended at
          # '== Base rootfs staged'). There is no background job to reap here, so
          # the step and the build succeed or fail together. stdbuf line-buffers
          # the build log so the runner streams it live; tee keeps build.log for
          # the upload-on-failure artifact.
          export RSTL_TRACE=1
          set +e
          timeout 110m stdbuf -oL -eL ./mkfrugal-rstl.sh \
            "$STAGE/rstlsway" --arch "$ARCH" --flavor install-base --stage-base --yes \
            --kernel linux-cachyos --cache "$GITHUB_WORKSPACE/cache" 2>&1 | tee build.log
          RC=$?
          set -e
          if [ "$RC" -eq 124 ]; then
            echo "::error::mkfrugal-rstl.sh timed out after 110m (base $ARCH)"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::mkfrugal-rstl.sh failed (base $ARCH) exit $RC"
            tail -80 build.log >&2
            echo "::warning::full build.log stored in the buildlog artifact"
            exit 1
          fi
          echo "mkfrugal-rstl.sh OK (base $ARCH)"
          # purge caches/logs so the artifact only carries the live system
          # (linux-cachyos is installed into the rootfs; layered builds never
          # re-download or reinstall it). -mindepth/-delete avoids the
          # unexpanded-glob failure mode of `rm -rf dir/*`.
          find "$STAGE/rstlsway/07rootfs/var/cache/pacman/pkg" -mindepth 1 -delete 2>/dev/null || true
          find "$STAGE/rstlsway/07rootfs/var/log" -mindepth 1 -delete 2>/dev/null || true
          echo "df before rootfs tar:"
          df -h "$STAGE" "$GITHUB_WORKSPACE" | sed 's/^/  /'
          free -m | head -2 | sed 's/^/  /'
          # 3 matrix jobs compress multi-GB rootfs in parallel; keep zstd cheap
          # (level 1, 2 threads) to avoid exhausting the shared runner memory.
          tar --zstd -I 'zstd -1 -T2' -C "$STAGE/rstlsway" -cf \
            "$GITHUB_WORKSPACE/baserootfs-$ARCH.tar.zst" 07rootfs
          TARRC=$?
          if [ "$TARRC" -ne 0 ]; then
            echo "::error::tar of base rootfs failed rc=$TARRC"
            df -h "$STAGE" "$GITHUB_WORKSPACE" | sed 's/^/  /'
            free -m | head -2 | sed 's/^/  /'
            rm -f "$GITHUB_WORKSPACE/baserootfs-$ARCH.tar.zst"
            exit "$TARRC"
          fi
          ls -lh "$GITHUB_WORKSPACE/baserootfs-$ARCH.tar.zst"

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: buildlog-base-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload baserootfs artifact
        uses: actions/upload-artifact@v5
        with:
          name: baserootfs-${{ matrix.arch }}
          path: baserootfs-${{ matrix.arch }}.tar.zst
          retention-days: 7

  # ---------------------------------------------------------------------------
  # phase 2: one job per flavor x arch - reuse the base, layer, wrap 3 kernels
  # ---------------------------------------------------------------------------
  build-iso:
    name: ${{ matrix.flavor }}-${{ matrix.arch }}
    needs: build-base
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: install, arch: v1 }
          - { flavor: install, arch: v2 }
          - { flavor: install, arch: v3 }
          - { flavor: install-min, arch: v1 }
          - { flavor: install-min, arch: v2 }
          - { flavor: install-min, arch: v3 }
          - { flavor: install-base, arch: v1 }
          - { flavor: install-base, arch: v2 }
          - { flavor: install-base, arch: v3 }
    steps:
      - name: Update system and install tooling
        run: |
          pacman -Syu --noconfirm \
            base-devel sudo git rust wget xorriso mtools dosfstools \
            squashfs-tools arch-install-scripts grub kmod cpio gzip xz zstd

      - name: Pin HOME=/root for chroot sanity
        run: echo "HOME=/root" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust git checkout (dubious ownership)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache huge-kernel firmware
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cache/01firmware.sfs
          key: cachyos-firmware

      - name: Fetch huge-kernel firmware
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/cache"
          [ -s "$GITHUB_WORKSPACE/cache/01firmware.sfs" ] && exit 0
          URL="https://gitlab.com/firstrib/firstrib/-/raw/master/latest/build_system/huge_kernels/kernel_usrmerge_default/01firmware.sfs"
          curl -fL --connect-timeout 30 --max-time 1800 --retry 3 --retry-delay 5 "$URL" -o "$GITHUB_WORKSPACE/cache/01firmware.sfs"

      - name: Cache vdpup huge kernel (vmlinuz + modules sfs + initrd)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/cache/vdpup-vmlinuz
            ${{ github.workspace }}/cache/vdpup-00modules.sfs
            ${{ github.workspace }}/cache/vdpup-initrd.gz
          key: vdpup-kernel-6.1.52

      - name: Cache rstl kernel (latest rstl.linuz release assets)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/cache/rstl-kernel.tar.zst
            ${{ github.workspace }}/cache/rstl-vmlinuz
            ${{ github.workspace }}/cache/rstl-00modules.sfs
            ${{ github.workspace }}/cache/rstl-modules
            ${{ github.workspace }}/cache/rstl-firmware.sfs
          key: rstl-kernel

      - name: Download base rootfs (baserootfs-${{ matrix.arch }})
        uses: actions/download-artifact@v5
        with:
          pattern: baserootfs-${{ matrix.arch }}
          path: ${{ github.workspace }}/base
          merge-multiple: true

      - name: Build layered frugals + wrap all kernel ISOs
        timeout-minutes: 150
        run: |
          set -uo pipefail
          chmod +x mkfrugal-rstl.sh mkfrugal-iso.sh mkFRkernel
          FLAVOR="${{ matrix.flavor }}"
          ARCH="${{ matrix.arch }}"
          DATE="$(date +%Y%m%d)"
          CACHE="$GITHUB_WORKSPACE/cache"
          BASE="$GITHUB_WORKSPACE/base/baserootfs-$ARCH.tar.zst"
          export RSTL_TRACE=1
          [ -s "$BASE" ] || { echo "::error::base artifact missing: $BASE"; exit 1; }

          case "$FLAVOR" in
            install|install-min) CONFIGS="vim vim-firefox mouse mouse-firefox" ;;
            install-base)        CONFIGS="standard firefox" ;;
          esac

          # run a build in the background with a 90s heartbeat + stall guard;
          # on failure print the log tail and abort. stdbuf keeps the log
          # line-buffered (it's redirected to a file) so tails are truthful.
          run_build() { # $1=label  $2=log  rest=command...
            local label="$1" log="$2"; shift 2
            setsid bash -c 'exec timeout 90m stdbuf -oL -eL "$@"' bash "$@" > "$log" 2>&1 &
            local pid=$!
            local lastsz="" stalls=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 90
              local sz tl proc
              sz=$(stat -c %s "$log" 2>/dev/null || echo 0)
              tl=$(tail -c 400 "$log" 2>/dev/null | tr '\r' '\n' | tail -1 | cut -c1-180)
              proc=$(ps -eo comm,etime 2>/dev/null | grep -E 'pacman|curl|arch-chroot|mkfrugal|mkFRkernel|tar|zstd|mksquashfs|gen_init|mkfs|grub|xorriso|chroot ' | grep -v grep | head -4 | tr '\n' ' ; ')
              av=$(free -m 2>/dev/null | awk '/Mem:/{print $7}')
              echo "still building $label ($(date -u +%H:%M:%S)Z, log ${sz}B, ${av}M avail) - $tl"
              [ -n "$proc" ] && echo "  active: $proc"
              if [ -n "$lastsz" ] && [ "$sz" -eq "$lastsz" ] && [ -z "$proc" ]; then
                stalls=$((stalls+1))
                if [ "$stalls" -ge 6 ]; then
                  echo "::error::$label: no log growth for 9m and no active child; aborting stalled build"
                  kill -TERM -- -"$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
                  break
                fi
              else
                stalls=0
              fi
              lastsz="$sz"
            done
            local rc=0
            wait "$pid" || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::error::$label timed out after 90m"
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$label failed (exit $rc)"
            else
              echo "$label OK"
            fi
            if [ "$rc" -ne 0 ]; then
              tail -80 "$log" >&2
              exit "$rc"
            fi
          }

          for PROG in $CONFIGS; do
            case "$PROG" in
              vim|vim-firefox)     PROGMODE=vim ;;
              mouse|mouse-firefox) PROGMODE=mouse ;;
              *) PROGMODE=standard ;;
            esac
            FIRE=0
            case "$PROG" in *-firefox|firefox) FIRE=1 ;; esac
            FIREBRA=""
            [ "$FIRE" -eq 1 ] && FIREBRA="--firefox"
            # program flags are meaningless for install-base (mkfrugal rejects
            # --program standard); pass them only for install/install-min
            ARGS_PROG=""
            if [ "$PROGMODE" != "standard" ]; then ARGS_PROG="--program $PROGMODE"; fi
            LABEL="$FLAVOR-$PROG-$ARCH"

            STAGE="$GITHUB_WORKSPACE/stage/$LABEL"
            rm -rf "$STAGE"
            mkdir -p "$STAGE" "$GITHUB_WORKSPACE/dist"
            T="$STAGE/rstlsway"
            mkdir -p "$T"
            echo "--- $LABEL: extracting base rootfs (reused, never rebuilt)"
            tar --zstd -xf "$BASE" -C "$T"

            # 1/3 cachyos: the ONLY layer build - reuse the base rootfs, re-stage
            # the dotfiles, run the flavor installer, assemble the frugal. No
            # pacstrap / CachyOS bootstrap / -Syu / kernel install happens here.
            run_build "$LABEL cachyos" "build-cachyos.log" \
              ./mkfrugal-rstl.sh \
                "$T" \
                --arch "$ARCH" \
                --flavor "$FLAVOR" \
                $ARGS_PROG $FIREBRA \
                --reuse-rootfs "$T/07rootfs" \
                --force \
                --yes \
                --kernel linux-cachyos \
                --firmware "$CACHE/01firmware.sfs" \
                --cache "$CACHE"
            ./mkfrugal-iso.sh \
              -d "$T" \
              -S "$STAGE" \
              -n rstlsway \
              -l RSTLSW \
              -o "dist/rstlsway-cachyos-$FLAVOR-$PROG-$ARCH-$DATE-x86_64.iso" || {
                echo "::error::mkfrugal-iso.sh failed (cachyos $LABEL)"
                exit 1
              }

            # 2/3 vdpup variant: the cachyos wrap squashed 07rootfs/ in place;
            # hardlink that frugal, swap the three boot files for the stock
            # huge-kernel assets (all cached), rewrap into a second ISO. No
            # second rootfs build at all.
            ./mkfrugal-rstl.sh --fetch-vdpup --cache "$CACHE"
            V="$STAGE/rstlsway-vdpup"
            cp -al "$T" "$V"
            for f in vmlinuz 00modules.sfs initrd.gz; do
              rm -f "$V/$f"
              cp -a "$CACHE/vdpup-$f" "$V/$f"
            done
            sed -i 's/rstlsway/rstlsway-vdpup/g' "$V/grub_config.txt"
            printf '%s\n' \
              "name:   rstlsway-vdpup" \
              "flavor: $FLAVOR" \
              "program: $PROGMODE${FIREBRA:+ + firefox}" \
              "arch:   x86-64-v${ARCH#v}" \
              "kernel: vdpup (FirstRib huge kernel 6.1.52)" \
              "build:  $(date -u '+%Y-%m-%d %H:%M UTC')" \
              > "$V/readme_kernel_version.txt"
            ./mkfrugal-iso.sh \
              -d "$V" \
              -S "$STAGE" \
              -n rstlsway-vdpup \
              -l RSTLSW \
              -o "dist/rstlsway-vdpup-$FLAVOR-$PROG-$ARCH-$DATE-x86_64.iso" || {
                echo "::error::mkfrugal-iso.sh failed (vdpup $LABEL)"
                exit 1
              }

            # 3/3 rstl variant: the rstl kernel has no pacman package. Rewrap
            # the cachyos frugal (07rootfs.sfs content is kernel-independent)
            # with the rstl vmlinuz + its module/firmware sfs, plus a freshly
            # built initrd from the cached rstl module tree so loop.ko rides in.
            ./mkfrugal-rstl.sh --fetch-rstl --cache "$CACHE"
            R="$STAGE/rstlsway-rstl"
            cp -al "$T" "$R"
            ( cd "$STAGE" \
              && "$GITHUB_WORKSPACE/mkFRkernel" latest "$CACHE/rstl-modules" gz \
                   > rstl-mkfrkernel.log 2>&1 ) || {
                 echo "::error::mkFRkernel failed (rstl $LABEL)"
                 tail -60 "$STAGE/rstl-mkfrkernel.log" >&2
                 exit 1
               }
            mv "$STAGE/initrd-latest.img" "$R/initrd.gz"
            if ! zcat "$R/initrd.gz" 2>/dev/null | cpio -it 2>/dev/null \
                | grep -q 'block/loop\.ko$'; then
              echo "::error::rstl initrd carries no loop.ko - not bootable (rstl $LABEL)"
              exit 1
            fi
            for f in vmlinuz 00modules.sfs 01firmware.sfs; do
              rm -f "$R/$f"
              cp -a "$CACHE/rstl-$f" "$R/$f"
            done
            sed -i 's/rstlsway/rstlsway-rstl/g' "$R/grub_config.txt"
            printf '%s\n' \
              "name:   rstlsway-rstl" \
              "flavor: $FLAVOR" \
              "program: $PROGMODE${FIREBRA:+ + firefox}" \
              "arch:   x86-64-v${ARCH#v}" \
              "kernel: rstl 7.x (github.com/arozoid/rstl.linuz latest release)" \
              "build:  $(date -u '+%Y-%m-%d %H:%M UTC')" \
              > "$R/readme_kernel_version.txt"
            ./mkfrugal-iso.sh \
              -d "$R" \
              -S "$STAGE" \
              -n rstlsway-rstl \
              -l RSTLSW \
              -o "dist/rstlsway-rstl-$FLAVOR-$PROG-$ARCH-$DATE-x86_64.iso" || {
                echo "::error::mkfrugal-iso.sh failed (rstl $LABEL)"
                exit 1
              }

            rm -rf "$STAGE"
          done
          ls -lh dist

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: buildlog-${{ matrix.flavor }}-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload ISO artifact (all kernels)
        uses: actions/upload-artifact@v5
        with:
          name: iso-${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/*.iso
          if-no-files-found: error

  release:
    needs: build-iso
    runs-on: ubuntu-latest
    steps:
      - name: Download all ISOs
        uses: actions/download-artifact@v5
        with:
          pattern: iso-*
          path: dist
          merge-multiple: true

      - name: Create YYYYMMDD-N release and prune to the 2 newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          date_tag="$(date +%Y%m%d)"
          rel=""
          for i in $(seq 1 99); do
            tag="${date_tag}-${i}"
            if ! gh release view "$tag" --json id --jq .id >/dev/null 2>&1; then
              rel="$tag"
              break
            fi
          done
          [ -n "$rel" ] || { echo "::error::too many releases for $date_tag"; exit 1; }
          echo "creating git tag + release '$rel'"
          cat > release-notes.md <<'EOF'
          `$ rstl.sway`

          Kernels:
          - rstl linux 7.x (rstl.sway's own kernel, mainline)
          - cachyOS linux 7.x (CachyOS optimized)
          - vdpup linux 6.1.52 (FirstRib huge kernel)

          Microarchitecture levels: v1 · v2 · v3

          Desktop configs:
          - install · install-min · install-base

          Program configs:
          - install: vim (nvim + superfile) · mouse (micro + cachyos-micro-settings + rovr) · vim + firefox · mouse + firefox
          - install-min: same program configs, keeping only each program's file manager
          - install-base: standard · standard + firefox (no program variants)

          Builds are autogenerated weekly and pruned to keep only the 2 most recent releases.
          EOF
          gh release create "$rel" \
            --target "$GITHUB_SHA" \
            --title "rstl.sway $rel" \
            --notes-file release-notes.md \
            dist/*.iso
          # prune: keep only the 2 newest releases (older releases + their
          # git tags are deleted)
          gh release list --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[2:][] | .tagName' 2>/dev/null \
            | while read -r old_tag; do
                [ -n "$old_tag" ] || continue
                echo "pruning $old_tag"
                gh release delete "$old_tag" --yes --cleanup-tag >/dev/null 2>&1 \
                  || echo "could not delete $old_tag"
              done