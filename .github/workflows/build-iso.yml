name: Build Archiso

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Daily build at 12:00 UTC (schedules are always UTC).
  schedule:
    - cron: "0 12 * * *"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Update system and install tooling
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            sudo \
            git \
            rust \
            archiso \
            arch-install-scripts \
            squashfs-tools \
            dosfstools \
            mtools \
            e2fsprogs \
            libarchive \
            gptfdisk \
            syslinux \
            grub \
            intel-ucode \
            amd-ucode

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and inject rstl-inst TUI
        run: |
          cd rstl-inst
          cargo build --release
          install -Dm755 target/release/rstl-inst \
            "$GITHUB_WORKSPACE/archiso/airootfs/usr/local/bin/rstl-inst"
          "$GITHUB_WORKSPACE/archiso/airootfs/usr/local/bin/rstl-inst" --version || true

      - name: Trust git checkout (dubious ownership)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/rstl-inst"

      - name: Build ISOs (v1..v4, in parallel)
        timeout-minutes: 90
        run: |
          chmod +x build-iso.sh
          ./build-iso.sh -o "$GITHUB_WORKSPACE/dist"

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rstlsway-isos
          path: dist/*.iso
          if-no-files-found: error
