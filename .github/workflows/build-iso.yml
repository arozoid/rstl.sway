name: Build Archiso

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Update system and install tooling
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            sudo \
            git \
            archiso
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ISO
        run: |
          chmod +x build-iso.sh
          ./build-iso.sh -o "$GITHUB_WORKSPACE/dist"
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rstlsway-iso
          path: dist/*.iso
          if-no-files-found: error
