# Minimal Artix runit repositories used only during ISO bootstrap.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8

[system]
Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch

[world]
Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch

[galaxy]
Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch

[lib32]
Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch
