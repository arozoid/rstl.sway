# rstl.sway foot config

# Font — matches the JetBrainsMono Nerd Font used everywhere else in the rice
font=JetBrainsMono Nerd Font:size=11.5

# Foresty-green theme (see themes/rstl-term.ini)
include=~/.config/foot/themes/rstl-term.ini

[main]
app-id=foot

[cursor]
style=block
blink=no

[scrollback]
lines=10000
